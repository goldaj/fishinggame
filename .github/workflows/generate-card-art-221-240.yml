name: Generate card art 221-240

on:
  push:
    branches: ["work/card-art-221-240"]

permissions:
  contents: write

jobs:
  generate:
    if: "${{ github.event.head_commit.message == 'ci: run card art generator 221-240' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/card-art-221-240
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate and integrate 221-240
        run: python tools/generate_card_art_221_240.py
      - name: Validate manifest and mapping
        run: node tests/card-art-manifest.test.js
      - name: Commit generated assets
        run: |
          rm tools/generate_card_art_221_240.py
          git config user.name goldaj
          git config user.email goldajj@gmail.com
          git add -A
          git commit -m "feat: integrate card art 221-240"
          git push origin HEAD:work/card-art-221-240
