name: Generate card art 381-420

on:
  push:
    branches: ["work/card-art-381-420"]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.head_commit.message == 'ci-run-card-art-381-420' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/card-art-381-420
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Resolve runtime names
        run: |
          node - <<'NODE' >/tmp/extra-card-art.json
          const G=require('./app/src/main/assets/v201.js');
          process.stdout.write(JSON.stringify(G.collectionCards().filter(c=>c.id>=401&&c.id<=420).map(c=>({id:c.id,name:c.name}))));
          NODE
          node - <<'NODE' >/tmp/next-card-art.json
          const G=require('./app/src/main/assets/v201.js');
          process.stdout.write(JSON.stringify(G.collectionCards().filter(c=>c.id>=421&&c.id<=460).map(c=>({id:c.id,name:c.name}))));
          NODE
      - name: Generate 381-420
        run: python tools/generate_card_art_381_420.py
      - name: Validate manifest and mapping
        run: node tests/card-art-manifest.test.js
      - name: Commit generated assets
        run: |
          rm tools/generate_card_art_381_420.py
          git config user.name goldaj
          git config user.email goldajj@gmail.com
          git add -A
          git commit -m "feat: integrate card art 381-420"
          git push origin HEAD:work/card-art-381-420
