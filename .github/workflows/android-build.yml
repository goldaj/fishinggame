name: Android Release Candidate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build unsigned release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android API 35 and Build Tools 35.0.0
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Run gameplay logic tests
        run: node tests/core.test.js

      - name: Check browser JavaScript syntax
        run: node --check app/src/main/assets/app.js

      - name: Bootstrap Gradle Wrapper when absent
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release candidate
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"
          cp "${ANDROID_HOME}/build-tools/35.0.0/lib/apksigner.jar" app/build/outputs/apk/release/apksigner.jar

      - name: Upload release candidate and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: peche-et-merveilles-release-candidate
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/apksigner.jar
          if-no-files-found: error
          retention-days: 7
