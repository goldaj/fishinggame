name: Android Release Candidate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build unsigned release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android API 35 and Build Tools 35.0.0
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Run gameplay logic tests
        run: |
          node tests/core.test.js
          node tests/v122.test.js
          node tests/v130.test.js
          node tests/v131.test.js
          node tests/v132.test.js
          node tests/v140.test.js
          node tests/v141.test.js
          node tests/v142.test.js
          node tests/v143.test.js
          node tests/v150.test.js
          node tests/v160.test.js
          node tests/v170.test.js
          node tests/v171.test.js

      - name: Check browser JavaScript syntax
        run: |
          node --check app/src/main/assets/v122.js
          node --check app/src/main/assets/v130.js
          node --check app/src/main/assets/v131.js
          node --check app/src/main/assets/v132.js
          node --check app/src/main/assets/v140-catalog.js
          node --check app/src/main/assets/v140.js
          node --check app/src/main/assets/v141.js
          node --check app/src/main/assets/v142-ui.js
          node --check app/src/main/assets/v143-ui.js
          node --check app/src/main/assets/v150.js
          node --check app/src/main/assets/v150-ui.js
          node --check app/src/main/assets/v160.js
          node --check app/src/main/assets/v160-ui.js
          node --check app/src/main/assets/v170.js
          node --check app/src/main/assets/v170-ui.js
          node --check app/src/main/assets/v171-ui.js
          node --check app/src/main/assets/catch-art.js
          node --check app/src/main/assets/catch-art-unique.js
          node --check app/src/main/assets/trash-art.js
          node --check app/src/main/assets/app.js

      - name: Bootstrap Gradle Wrapper when absent
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release candidate
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          unzip -l "$APK" | grep -E 'assets/(v140-catalog.js|v140.js|v140.css|v141.js|v141.css|v142-ui.js|v142.css|v143-ui.js|v143.css|v150.js|v150-ui.js|v150.css|v160.js|v160-ui.js|v160.css|v170.js|v170-ui.js|v170.css|v171-ui.js|v171.css|index.html|app.js|catch-art.js|catch-art-unique.js)'
          sha256sum "$APK"
          cp "${ANDROID_HOME}/build-tools/35.0.0/lib/apksigner.jar" app/build/outputs/apk/release/apksigner.jar

      - name: Upload release candidate and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: peche-et-merveilles-release-candidate
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/apksigner.jar
          if-no-files-found: error
          retention-days: 7