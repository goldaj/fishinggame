name: Android Release Candidate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build unsigned release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: ""
          log-accepted_android_sdk_licenses: "false"

      - name: Install Android API 35 and Build Tools 35.0.0
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Run gameplay logic tests
        run: |
          node tests/core.test.js
          node tests/v122.test.js
          node tests/v130.test.js
          node tests/v131.test.js
          node tests/v132.test.js
          node tests/v140.test.js
          node tests/v141.test.js
          node tests/v142.test.js
          node tests/v143.test.js
          node tests/v150.test.js
          node tests/v160.test.js
          node tests/v170.test.js
          node tests/v171.test.js
          node tests/v173.test.js
          node tests/v174.test.js
          node tests/v175.test.js
          node tests/v180.test.js
          node tests/v190.test.js
          node tests/v200.test.js
          node tests/v201.test.js
          node tests/v205.test.js
          node tests/v208.test.js
          node tests/card-art-manifest.test.js

      - name: Check browser JavaScript syntax
        run: |
          node --check app/src/main/assets/v122.js
          node --check app/src/main/assets/v130.js
          node --check app/src/main/assets/v131.js
          node --check app/src/main/assets/v132.js
          node --check app/src/main/assets/v140-catalog.js
          node --check app/src/main/assets/v140.js
          node --check app/src/main/assets/v141.js
          node --check app/src/main/assets/v142-ui.js
          node --check app/src/main/assets/v143-ui.js
          node --check app/src/main/assets/v150.js
          node --check app/src/main/assets/v150-ui.js
          node --check app/src/main/assets/v160.js
          node --check app/src/main/assets/v160-ui.js
          node --check app/src/main/assets/v170.js
          node --check app/src/main/assets/v170-ui.js
          node --check app/src/main/assets/v171-ui.js
          node --check app/src/main/assets/v173.js
          node --check app/src/main/assets/v173-ui.js
          node --check app/src/main/assets/v174.js
          node --check app/src/main/assets/v174-ui.js
          node --check app/src/main/assets/v175.js
          node --check app/src/main/assets/v175-ui.js
          node --check app/src/main/assets/v180-ui.js
          node --check app/src/main/assets/v190-ui.js
          node --check app/src/main/assets/v200.js
          node --check app/src/main/assets/v200-ui.js
          node --check app/src/main/assets/v201.js
          node --check app/src/main/assets/v201-ui.js
          node --check app/src/main/assets/v205-ui.js
          node --check app/src/main/assets/v208.js
          node --check app/src/main/assets/v208-ui.js
          node --check app/src/main/assets/catch-art.js
          node --check app/src/main/assets/catch-art-unique.js
          node --check app/src/main/assets/trash-art.js
          node --check app/src/main/assets/app.js

      - name: Bootstrap Gradle Wrapper when absent
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release candidate
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='32' versionName='2.0.8'"
          unzip -l "$APK" | grep -E 'assets/(v140-catalog.js|v140.js|v140.css|v141.js|v141.css|v142-ui.js|v142.css|v143-ui.js|v143.css|v150.js|v150-ui.js|v150.css|v160.js|v160-ui.js|v160.css|v170.js|v170-ui.js|v170.css|v171-ui.js|v171.css|v173.js|v173-ui.js|v173.css|v174.js|v174-ui.js|v174.css|v175.js|v175-ui.js|v175.css|v180-ui.js|v180.css|v190-ui.js|v190.css|v200.js|v200-ui.js|v200.css|v201.js|v201-ui.js|v204.css|v205-ui.js|v205.css|v208.js|v208-ui.js|v208.css|index.html|app.js|catch-art.js|catch-art-unique.js|trash-art.js)'
          unzip -p "$APK" assets/index.html | grep -F '<title>Fishing Cards</title>'
          unzip -p "$APK" assets/index.html | grep -F '<link rel="stylesheet" href="v204.css">'
          unzip -p "$APK" assets/index.html | grep -F '<link rel="stylesheet" href="v205.css">'
          unzip -p "$APK" assets/index.html | grep -F '<link rel="stylesheet" href="v208.css">'
          unzip -p "$APK" assets/index.html | grep -F '<script src="v160-ui.js"></script>'
          unzip -p "$APK" assets/index.html | grep -F '<script src="v170-ui.js"></script>'
          unzip -p "$APK" assets/index.html | grep -F '<script src="v171-ui.js"></script>'
          unzip -p "$APK" assets/index.html | grep -F '<script src="v174.js"></script>'
          unzip -p "$APK" assets/index.html | grep -F '<script src="v175.js"></script>'
          unzip -p "$APK" assets/index.html | grep -F '<script src="v201-ui.js"></script>'
          unzip -p "$APK" assets/index.html | grep -F '<script src="v205-ui.js"></script>'
          unzip -p "$APK" assets/index.html | grep -F '<script src="v208.js"></script>'
          unzip -p "$APK" assets/index.html | grep -F '<script src="v208-ui.js"></script>'
          unzip -p "$APK" assets/v200.js | grep -F "G.unifiedCardsVersion='2.0.0'"
          unzip -p "$APK" assets/v201.js | grep -F "G.duplicateCardMarketVersion='2.0.4'"
          unzip -p "$APK" assets/v201.js | grep -F "G.releaseVersion=isNode?'2.0.4':'1.7.0'"
          unzip -p "$APK" assets/v201-ui.js | grep -F "G.releaseVersion='2.0.4'"
          unzip -p "$APK" assets/v201-ui.js | grep -F 'card-duplicate-row-v201'
          ! unzip -p "$APK" assets/v201-ui.js | grep -q 'boosterOpening'
          ! unzip -p "$APK" assets/v201-ui.js | grep -q 'tearZone'
          unzip -p "$APK" assets/v170-ui.js | grep -F 'zone.onpointerdown'
          unzip -p "$APK" assets/v170-ui.js | grep -F 'shell.onpointerdown'
          unzip -p "$APK" assets/v171-ui.js | grep -F "dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'"
          unzip -p "$APK" assets/v174.js | grep -F "G.releaseVersion='1.7.4'"
          unzip -p "$APK" assets/v175.js | grep -F "G.releaseVersion='1.7.5'"
          unzip -p "$APK" assets/v175-ui.js | grep -F 'G.boosterFoldStartDirection'
          unzip -p "$APK" assets/v204.css | grep -F '#boosterOpening .swipe-hint'
          unzip -p "$APK" assets/v204.css | grep -F '#boosterOpening #tearFallback'
          unzip -p "$APK" assets/v205.css | grep -F 'height:12px!important'
          unzip -p "$APK" assets/v205.css | grep -F '#boosterOpening #edgeFallback'
          unzip -p "$APK" assets/v205-ui.js | grep -F "forward('onpointerdown',e)"
          unzip -p "$APK" assets/v205-ui.js | grep -F 'result.cards[index]'
          ! unzip -p "$APK" assets/v205-ui.js | grep -q 'G.boosterFoldDecision='
          ! unzip -p "$APK" assets/v205-ui.js | grep -q 'G.releaseVersion='
          unzip -p "$APK" assets/v208.js | grep -F "G.fishingBalanceVersion='2.0.8'"
          unzip -p "$APK" assets/v208-ui.js | grep -F 'installFishingHeroClick'
          unzip -p "$APK" assets/v208-ui.js | grep -F 'installPackPreviewClick'
          unzip -p "$APK" assets/v200-ui.js | grep -F 'fishing-trash-card-v200'
          unzip -p "$APK" assets/v190-ui.js | grep -F "G.fishingExperienceVersion='1.9.0'"
          unzip -l "$APK" | grep -F 'assets/card-art/040.webp'
          unzip -l "$APK" | grep -F 'assets/card-art/manifest.json'
          sha256sum "$APK"
          cp "${ANDROID_HOME}/build-tools/35.0.0/lib/apksigner.jar" app/build/outputs/apk/release/apksigner.jar

      - name: Upload release candidate and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: fishing-cards-release-candidate
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/apksigner.jar
          if-no-files-found: error
          retention-days: 7
