name: Get a Point APK

on:
  push:
    branches: ["chatgpt/get-a-point-20260902"]
    paths:
      - "get-a-point/**"
      - ".github/workflows/get-a-point-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: get-a-point
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          cp get-a-point/app/build/outputs/apk/debug/app-debug.apk Get-a-Point.apk
          test -s Get-a-Point.apk
          unzip -tq Get-a-Point.apk
          sha256sum Get-a-Point.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: get-a-point-apk
          path: Get-a-Point.apk
          if-no-files-found: error
          retention-days: 7
