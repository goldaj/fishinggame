name: Generate card art 261-270

on:
  push:
    branches: ["work/card-art-261-270"]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.head_commit.message == 'ci-run-card-art-261-270' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/card-art-261-270
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Resolve next runtime queue
        run: |
          node - <<'NODE' >/tmp/next-card-art.json
          const G=require('./app/src/main/assets/v201.js');
          const rows=G.collectionCards().filter(c=>c.id>=271&&c.id<=280).map(c=>({id:c.id,name:c.name}));
          process.stdout.write(JSON.stringify(rows));
          NODE
      - name: Generate 261-270
        run: python tools/generate_card_art_261_270.py
      - name: Validate manifest and mapping
        run: node tests/card-art-manifest.test.js
      - name: Commit generated assets
        run: |
          rm tools/generate_card_art_261_270.py
          git config user.name goldaj
          git config user.email goldajj@gmail.com
          git add -A
          git commit -m "feat: integrate card art 261-270"
          git push origin HEAD:work/card-art-261-270
