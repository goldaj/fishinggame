name: Generate card art 161-170

on:
  push:
    branches: ["work/card-art-161-170-complete"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/card-art-161-170-complete
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate assets and update metadata
        run: python tools/generate_card_art_161_170.py
      - name: Validate card art manifest
        run: node tests/card-art-manifest.test.js
      - name: Commit generated card art
        run: |
          rm -f tools/generate_card_art_161_170.py .github/workflows/generate-card-art-161-170.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "art: integrate card images 161-170 [generated-card-art-161-170]"
          git push origin HEAD:work/card-art-161-170-complete
