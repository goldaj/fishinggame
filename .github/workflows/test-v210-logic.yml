name: Test v210 logic

on:
  push:
    branches: ["work/v210-card-collection"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check syntax
        run: |
          node --check app/src/main/assets/v210.js
          node --check app/src/main/assets/v210-ui.js
      - name: Run v210 tests
        run: node tests/v210.test.js
