name: Generate final card art 421-504

on:
  push:
    branches: ["work/card-art-421-504"]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.head_commit.message == 'chore: add controlled generator for card art 421-504' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/card-art-421-504
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Resolve all remaining runtime cards
        run: |
          node - <<'NODE' >/tmp/missing-card-art.json
          const G=require('./app/src/main/assets/v201.js');
          const all=G.collectionCards();
          const byId=new Map(all.map(c=>[Number(c.id),c]));
          const ids=[...Array.from({length:80},(_,i)=>421+i),1001,1002,1003,1004];
          const rows=ids.map(id=>{
            const c=byId.get(id);
            if(!c) throw new Error(`Missing runtime card ${id}`);
            return {id:Number(c.id),name:c.name,assetKind:c.assetKind||'',isTrash:!!c.isTrash};
          });
          process.stdout.write(JSON.stringify(rows));
          NODE
      - name: Generate remaining 84 card illustrations
        run: python tools/generate_card_art_421_504.py
      - name: Validate complete card art manifest
        run: node tests/card-art-manifest.test.js
      - name: Check renderer syntax
        run: node --check app/src/main/assets/trash-art.js
      - name: Commit generated assets
        run: |
          rm tools/generate_card_art_421_504.py
          rm .github/workflows/generate-card-art-421-504.yml
          git config user.name goldaj
          git config user.email goldajj@gmail.com
          git add -A
          git commit -m "feat: integrate final card art 421-504"
          git push origin HEAD:work/card-art-421-504
